name: PR Build

on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  build:
    uses: LayeredCraft/devops-templates/.github/workflows/pr-build.yaml@v11.2
    with:
      solution: LayeredCraft.Cdk.Constructs.slnx
      hasTests: true
      useMtpRunner: true
      enableCodeCoverage: true
      coverageThreshold: 80
      dotnetVersion: |
        10.0.x
        11.0.x
      globalJsonFile: global.json
